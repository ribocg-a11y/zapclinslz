    <path d="M52 208l4.5 10 10 4.5-10 4.5-4.5 10-4.5-10-10-4.5 10-4.5z" fill="#7BFFD5"/>
    <path d="M98 214l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5z" fill="#fff"/>
    <path d="M44 236c20-12 40-14 62-8" fill="none" stroke="#7BFFD5" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 254c16-8 32-10 50-6" fill="none" stroke="#7BFFD5" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- capacete -->
  <g fill="none" stroke="url(#hg)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
