             C385 188 420 215 430 250
             C395 262 350 268 305 265
             C255 262 215 255 195 245Z"/>
    <!-- linha da queixeira -->
    <path d="M205 320 C245 342 290 350 340 348 C375 346 405 335 425 318"/>
  </g>

  <!-- estrela na viseira -->
  <path d="M318 218 l11 26 28 11 -28 11 -11 26 -11 -26 -28 -11 28 -11z" fill="#FFFFFF"/>

  <!-- ZapClin -->
  <text x="260" y="445" text-anchor="middle"
        font-family="Montserrat, Arial Black, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#4FF0CF">Zap</tspan><tspan fill="#FFFFFF">Clin</tspan>
  </text>

  <!-- tagline -->
  <text x="260" y="495" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="25" font-weight="700" fill="#FFFFFF">
    Higieniza??o de Capacetes
