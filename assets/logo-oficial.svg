<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" role="img" aria-label="ZapClin Higieniza??o de Capacetes">
  <defs>
    <linearGradient id="hg" x1="120" y1="300" x2="360" y2="60" gradientUnits="userSpaceOnUse">
